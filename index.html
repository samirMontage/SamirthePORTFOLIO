<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamirToCreator | Premium Editor</title>
    <style>
        :root {
            --accent: #6366f1;
            --bg: #020204;
            --card-bg: rgba(255, 255, 255, 0.01);
            --border: rgba(255, 255, 255, 0.06);
            --text-muted: #8e8e93;
            --blue-glow: #4d61fc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Интерактивный живой фон (Glow Blobs) */
        .glow-blob {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            filter: blur(130px);
            opacity: 0.6;
            animation: floatBlobs 25s infinite alternate ease-in-out;
        }
        .blob-1 {
            top: -10%;
            left: -10%;
            background: rgba(77, 97, 252, 0.25);
        }
        .blob-2 {
            bottom: 15%;
            right: -10%;
            background: rgba(99, 102, 241, 0.18);
            animation-delay: -7s;
        }
        @keyframes floatBlobs {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 50px) scale(1.15); }
            100% { transform: translate(-50px, 90px) scale(0.9); }
        }

        /* Кинозернистость */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Noise_Texture.png');
            opacity: 0.02;
            pointer-events: none;
            z-index: 9999;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Шапка */
        header {
            position: fixed;
            top: 0; width: 100%;
            z-index: 1000;
            background: rgba(2, 2, 4, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover { color: #fff; }

        /* Главный экран */
        .hero {
            padding: 240px 0 60px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(2.3rem, 6vw, 4.2rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -2px;
            margin-bottom: 24px;
            background: linear-gradient(180deg, #fff 50%, rgba(255,255,255,0.5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 580px;
            margin: 0 auto 48px;
        }

        /* Неоновые Кнопки */
        .hero-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 20px 42px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1rem;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary { 
            background: linear-gradient(135deg, #4d61fc, #6366f1); 
            color: #fff; 
            box-shadow: 0 0 35px rgba(77, 97, 252, 0.6);
            border: 1px solid rgba(255,255,255,0.15);
        }
        
        .btn-primary:hover { 
            transform: translateY(-5px) scale(1.03); 
            box-shadow: 0 15px 40px rgba(77, 97, 252, 0.8);
            background: linear-gradient(135deg, #5b6efe, #7275f4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.12);
        }

        /* Результаты и Статистика */
        .stats-section {
            padding: 40px 0 80px;
            perspective: 1000px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            backdrop-filter: blur(15px);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.4s, background 0.4s, box-shadow 0.4s;
        }

        .stat-card:hover {
            border-color: rgba(99, 102, 241, 0.35);
            background: rgba(99, 102, 241, 0.03);
            transform: translateY(-8px) rotateX(4deg) rotateY(-3deg);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15);
        }

        .stat-number {
            font-size: clamp(2.3rem, 4.5vw, 3.6rem);
            font-weight: 800;
            color: var(--blue-glow);
            letter-spacing: -1px;
            margin-bottom: 10px;
            line-height: 1;
            text-shadow: 0 0 20px rgba(77, 97, 252, 0.2);
        }

        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #727279;
            font-weight: 700;
        }

        /* Бегущая строка */
        .marquee {
            padding: 40px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            opacity: 0.25;
        }

        .marquee-track {
            display: flex;
            animation: scroll 20s linear infinite;
            white-space: nowrap;
        }

        .marquee-track span {
            font-size: 1.2rem;
            font-weight: 700;
            margin-right: 60px;
            text-transform: uppercase;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Портфолио Вертикальное */
        .portfolio { padding: 100px 0 40px; }
        
        .section-title {
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }
