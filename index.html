<style>
        :root {
            --accent: #6366f1;
            --bg: #f8f9fa; /* Светлый фон */
            --card-bg: #ffffff; /* Белые карточки */
            --text-main: #111827; /* Темный текст */
            --text-muted: #6b7280; /* Серый текст */
            --border: #e5e7eb; /* Светлая рамка */
            --blue-glow: #4f46e5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; scroll-behavior: smooth; }

        body { background-color: var(--bg); color: var(--text-main); -webkit-font-smoothing: antialiased; }

        /* Настройка карточек и заголовков под светлый стиль */
        .card { background: var(--card-bg); border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .section-title { color: var(--text-main); background: none; -webkit-background-clip: initial; -webkit-text-fill-color: initial; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border); }
        .about-wrapper, .step-card, .faq-item { background: var(--card-bg); border: 1px solid var(--border); }
        
        /* Скроллбар для светлого */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* Убираем лишние элементы темной темы */
        .glow-blob, body::after { display: none; }
        
        /* Исправление цветов текста */
        .hero h1 { color: var(--text-main); background: none; -webkit-text-fill-color: initial; }
        .hero p { color: var(--text-muted); }
        nav a { color: var(--text-muted); }
        nav a:hover { color: var(--text-main); }
        .card-info h3 { color: var(--text-main); }
        
        /* Остальные стили (структуру оставляем прежней) */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
        .btn-primary { background: var(--accent); color: white; box-shadow: none; }
        .btn-secondary { background: #f3f4f6; color: var(--text-main); border: 1px solid var(--border); }
        .step-card h3 { color: var(--text-main); }
        
        /* (Оставь все остальные стили из предыдущего кода, они подхватят новые цвета) */
    </style>
