<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamirToCreator | Premium Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #6366f1;
            --bg: #020204;
            --card-bg: rgba(255, 255, 255, 0.01);
            --border: rgba(255, 255, 255, 0.06);
            --text-muted: #8e8e93;
            --blue-glow: #4d61fc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Интерактивный живой фон (Glow Blobs) */
        .glow-blob {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            filter: blur(130px);
            opacity: 0.45;
            animation: floatBlobs 25s infinite alternate ease-in-out;
        }
        .blob-1 {
            top: -10%;
            left: -10%;
            background: rgba(77, 97, 252, 0.25);
        }
        .blob-2 {
            bottom: 15%;
            right: -10%;
            background: rgba(99, 102, 241, 0.18);
            animation-delay: -7s;
        }
        @keyframes floatBlobs {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 50px) scale(1.15); }
            100% { transform: translate(-50px, 90px) scale(0.9); }
        }

        /* Кинозернистость на фоне */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Noise_Texture.png');
            opacity: 0.015;
            pointer-events: none;
            z-index: 9999;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Безопасная CSS-анимация появления при скролле */
        .reveal {
            opacity: 0;
            transform: translateY(30px) scale(0.98);
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Шапка сайта */
        header {
            position: fixed;
            top: 0; width: 100%;
            z-index: 1000;
            background: rgba(2, 2, 4, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover { color: #fff; }

        /* Главный экран (Hero) - Анимация на чистом CSS, без рисков */
        .hero {
            padding: 240px 0 60px;
            text-align: center;
            animation: heroFadeIn 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes heroFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero h1 {
            font-size: clamp(2.3rem, 6vw, 4.2rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -2px;
            margin-bottom: 24px;
            background: linear-gradient(180deg, #fff 50%, rgba(255,255,255,0.5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 580px;
            margin: 0 auto 48px;
        }

        /* Премиальные Неоновые Кнопки */
        .hero-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 20px 42px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1rem;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary { 
            background: linear-gradient(135deg, #4d61fc, #6366f1); 
            color: #fff; 
            box-shadow: 0 0 35px rgba(77, 97, 252, 0.4);
            border: 1px solid rgba(255,255,255,0.15);
        }
        
        .btn-primary:hover { 
            transform: translateY(-5px) scale(1.03); 
            box-shadow: 0 15px 40px rgba(77, 97, 252, 0.7);
            background: linear-gradient(135deg, #5b6efe, #7275f4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            border: 1px
